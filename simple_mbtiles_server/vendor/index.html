<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Example map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="/v1/static/maplibre-gl@5.19.0/maplibre-gl.js"></script>
    <link href="/v1/static/maplibre-gl@5.19.0/maplibre-gl.css" rel="stylesheet">
    <style>
      body, html, #map {margin: 0; padding: 0; height: 100%; width: 100%}
      #toolbar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: white;
        padding: 5px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .toolbar-btn {
        cursor: pointer;
        padding: 5px 8px;
        border: 1px solid #ddd;
        border-radius: 3px;
        background: #f5f5f5;
        font-size: 13px;
        line-height: 1;
        white-space: nowrap;
      }
      .toolbar-btn:hover {
        background: #e8e8e8;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="toolbar">
      <label class="toolbar-btn">GPX laden<input type="file" id="gpx-input" accept=".gpx" style="display:none"></label>
      <button id="gpx-clear" class="toolbar-btn" title="Track entfernen">🗑</button>
      <select id="style-select" class="toolbar-btn">
        <option value="osm-bright-gl-style" selected>OSM Bright</option>
        <option value="dark-matter-gl-style">Dark Matter</option>
        <option value="fiord-color-gl-style">Fiord Color</option>
        <option value="maptiler-3d-gl-style">MapTiler 3D</option>
        <option value="maptiler-basic-gl-style">MapTiler Basic</option>
        <option value="maptiler-terrain-gl-style">MapTiler Terrain</option>
        <option value="maptiler-toner-gl-style">MapTiler Toner</option>
        <option value="positron-gl-style">Positron</option>
      </select>
    </div>
			<script>
				var gpxData = null;

			function addGpxLayers() {
			  if (!gpxData) return;
			  map.addSource('gpx', { type: 'geojson', data: gpxData });
			  map.addLayer({ id: 'gpx-casing', type: 'line', source: 'gpx', paint: { 'line-color': '#fff', 'line-width': 5, 'line-opacity': 0.6 } });
			  map.addLayer({ id: 'gpx-line',   type: 'line', source: 'gpx', paint: { 'line-color': '#e74c3c', 'line-width': 3 } });
			}

			var map = new maplibregl.Map({
				    container: 'map',
				    style: '/v1/styles/osm-bright-gl-style@1.0.0/style.json?fonts=fonts-gl@1.0.0&tiles=mytiles@1.0.0',
				    center: [0, 0],
				    zoom: 1,
				    attributionControl: false
				});
				map.addControl(new maplibregl.AttributionControl({
				    customAttribution: '<a href="https://openmaptiles.org/">© OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a> Served by <a href="https://github.com/markuman/sms">⚡sms🚀</a>'
				}, 'bottom-right'));

				// Parameter aus dem URL abrufen
				function getUrlParams() {
				  const params = new URLSearchParams(window.location.search);
				  return {
				    lat: parseFloat(params.get('lat')) || 0,
				    lng: parseFloat(params.get('lng')) || 0,
				    zoom: parseInt(params.get('zoom')) || 1
				  };
				}

				// Parameter abrufen und in die Map einfügen
				const params = getUrlParams();
				map.on('load', () => { // Wichtig: Nach dem Laden der Map-Ressourcen
				  map.jumpTo({
				    center: [params.lng, params.lat],
				    zoom: params.zoom
				  });
				});

        // Style wechseln
        document.getElementById('style-select').addEventListener('change', function() {
          const url = '/v1/styles/' + this.value + '@1.0.0/style.json?fonts=fonts-gl@1.0.0&tiles=mytiles@1.0.0';
          map.setStyle(url);
          map.once('style.load', addGpxLayers);
        });

        // GPX Track entfernen
        document.getElementById('gpx-clear').addEventListener('click', function() {
          ['gpx-line', 'gpx-casing'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
          if (map.getSource('gpx')) map.removeSource('gpx');
          document.getElementById('gpx-input').value = '';
          gpxData = null;
        });

        // GPX laden
        document.getElementById('gpx-input').addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(ev) {
            const gpx = new DOMParser().parseFromString(ev.target.result, 'application/xml');
            const coords = [];
            gpx.querySelectorAll('trkpt').forEach(pt => {
              coords.push([parseFloat(pt.getAttribute('lon')), parseFloat(pt.getAttribute('lat'))]);
            });
            if (!coords.length) return;
            gpxData = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
            ['gpx-line', 'gpx-casing'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
            if (map.getSource('gpx')) map.removeSource('gpx');
            addGpxLayers();
            const lngs = coords.map(c => c[0]);
            const lats = coords.map(c => c[1]);
            map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], { padding: 40 });
          };
          reader.readAsText(file);
        });
			</script>
  </body>
</html>
